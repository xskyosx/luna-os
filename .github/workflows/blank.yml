name: LUNA OS checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python engines and tests
        run: python -m py_compile luna_memory.py aurora_xlii.py aurora_xl.py tests/test_luna_memory.py tests/test_aurora_portability.py
      - name: Run Aurora simulations twice and verify reproducibility
        run: |
          python aurora_xlii.py > /dev/null
          sha256sum results/aurora_xlii_results.json > /tmp/aurora_xlii.sha256
          python aurora_xlii.py > /dev/null
          sha256sum --check /tmp/aurora_xlii.sha256
          python aurora_xl.py > /dev/null
          sha256sum results/aurora_xl_results.json > /tmp/aurora_xl.sha256
          python aurora_xl.py > /dev/null
          sha256sum --check /tmp/aurora_xl.sha256
      - name: Validate Aurora result summaries
        run: |
          python -c "import json; from pathlib import Path; p=Path('results'); a=json.loads((p/'aurora_xlii_results.json').read_text(encoding='utf-8')); b=json.loads((p/'aurora_xl_results.json').read_text(encoding='utf-8')); assert a['experiment']=='AXLII-COUNTERFACTUAL-TWIN' and a['replicates']==512; assert b['experiment']=='AXL-BASELINE-IDENTITY' and b['replicates']==384; print('Aurora XL and XLII result summaries validated.')"
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
