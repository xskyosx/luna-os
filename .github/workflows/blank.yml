name: LUNA OS checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile memory engine and tests
        run: python -m py_compile luna_memory.py tests/test_luna_memory.py
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
