name: LUNA OS checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python engines and tests
        run: python -m py_compile luna_memory.py aurora_xlii.py aurora_xl.py tests/test_luna_memory.py tests/test_aurora_portability.py tests/test_luna_voice.py
      - name: Run Aurora simulations twice and verify reproducibility
        run: |
          python aurora_xlii.py > /dev/null
          sha256sum results/aurora_xlii_results.json > /tmp/aurora_xlii.sha256
          python aurora_xlii.py > /dev/null
          sha256sum --check /tmp/aurora_xlii.sha256
          python aurora_xl.py > /dev/null
          sha256sum results/aurora_xl_results.json > /tmp/aurora_xl.sha256
          python aurora_xl.py > /dev/null
          sha256sum --check /tmp/aurora_xl.sha256
      - name: Validate and summarize Aurora results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("results")
          xlii = json.loads((out / "aurora_xlii_results.json").read_text(encoding="utf-8"))
          xl = json.loads((out / "aurora_xl_results.json").read_text(encoding="utf-8"))
          assert xlii["experiment"] == "AXLII-COUNTERFACTUAL-TWIN" and xlii["replicates"] == 512
          assert xl["experiment"] == "AXL-BASELINE-IDENTITY" and xl["replicates"] == 384
          print("Aurora XLII — counterfactual twin:")
          for name, values in xlii["summaries"].items():
              print(f"  {name}: final_divergence={values['final_divergence']:.6f}, peak={values['peak_divergence']:.6f}, reconverged_rate={values['reconverged_rate']:.3f}")
          print("Aurora XL — baseline identity:")
          for name, values in xl["conditions"].items():
              print(f"  {name}: post_intersection={values['post_intersection']:.6f}, delta={values['intersection_delta']:.6f}, disagreement={values['mean_disagreement']:.6f}")
          print("Aurora outputs validated. These are simulation results, not physical measurements.")
          PY
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
